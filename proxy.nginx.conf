server {
  listen 3000;
  client_max_body_size 200m;
  location / {
    proxy_pass http://127.0.0.1:47262;
    proxy_http_version 1.1;
    proxy_set_header Host 127.0.0.1:47262;
    # The daemon only trusts its loopback origin; the sandbox proxy changes both.
    proxy_set_header Origin http://127.0.0.1:47262;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 1h;
  }
}
map $http_upgrade $connection_upgrade { default upgrade; '' close; }
