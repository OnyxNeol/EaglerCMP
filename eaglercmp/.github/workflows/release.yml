name: release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version label for the archives (manual runs do not publish a release)"
        required: false
        default: ""
      client_source:
        description: "Eaglercraft client to embed (default: upstream repo eymenwsmc/playopspt.github.io, 262/)"
        required: false
        default: "https://raw.githubusercontent.com/eymenwsmc/playopspt.github.io/main/262/index.html"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CGO_ENABLED: "0"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Check formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test ./...

  client:
    # Fetch the Eaglercraft 26.2 client once from the upstream repo (its
    # 262/index.html redirects to the current self-contained build) so every
    # platform embeds the same bytes.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Fetch Eaglercraft client
        env:
          CLIENT_SOURCE: ${{ inputs.client_source || 'https://raw.githubusercontent.com/eymenwsmc/playopspt.github.io/main/262/index.html' }}
        run: |
          go run . import -dir "$RUNNER_TEMP/inst" "$CLIENT_SOURCE"
          entry=$(jq -r .entry "$RUNNER_TEMP/inst/client/.eaglercmp-client.json")
          tar -czf bundle/client.tar.gz -C "$RUNNER_TEMP/inst/client" --exclude=.eaglercmp-client.json .
          echo "$CLIENT_SOURCE -> $entry, fetched $(date -u +%Y-%m-%d)" > bundle/source.txt
          cat bundle/source.txt
          sha256sum bundle/client.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: eaglercraft-client
          path: |
            bundle/client.tar.gz
            bundle/source.txt
          if-no-files-found: error
          retention-days: 7

  build:
    needs: [test, client]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64, runner: ubuntu-latest,  smoke: true }
          - { goos: windows, goarch: amd64, runner: windows-latest, smoke: true }
          - { goos: darwin,  goarch: amd64, runner: macos-latest,   smoke: false }
          - { goos: darwin,  goarch: arm64, runner: macos-latest,   smoke: true }
    runs-on: ${{ matrix.runner }}
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    env:
      GOFLAGS: -tags=bundled
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: actions/download-artifact@v4
        with:
          name: eaglercraft-client
          path: bundle

      - name: Resolve version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            v="$GITHUB_REF_NAME"
          elif [[ -n "$INPUT_VERSION" ]]; then
            v="$INPUT_VERSION"
          else
            v="dev-${GITHUB_SHA::7}"
          fi
          if [[ ! "$v" =~ ^[A-Za-z0-9._+-]+$ ]]; then
            echo "invalid version label: $v" >&2
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Build (scripts/build.sh)
        if: matrix.goos != 'windows'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SKIP_CHECKS: "1"
        run: scripts/build.sh --target "${{ matrix.goos }}/${{ matrix.goarch }}"

      - name: Build (scripts/build.ps1)
        if: matrix.goos == 'windows'
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: .\scripts\build.ps1 -Target "${{ matrix.goos }}/${{ matrix.goarch }}" -Version "$env:VERSION" -SkipChecks

      - name: Smoke test
        if: matrix.smoke
        shell: bash
        run: |
          ext=""; [[ "${{ matrix.goos }}" == "windows" ]] && ext=".exe"
          "./bin/eaglercmp${ext}" help
          "./bin/eaglercmp${ext}" credits
          "./bin/eaglercmp${ext}" init -dir "$RUNNER_TEMP/eaglercmp"
          "./bin/eaglercmp${ext}" status -dir "$RUNNER_TEMP/eaglercmp" | tee status.txt
          grep -q "Source:    bundled" status.txt

      - name: Package
        id: package
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: echo "archive=$(scripts/package.sh '${{ matrix.goos }}' '${{ matrix.goarch }}' "$VERSION")" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: eaglercmp-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum eaglercmp-* | tee SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=""
          [[ "$TAG" == *-* ]] && prerelease="--prerelease"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" \
              --title "EaglerCMP $TAG" --generate-notes --verify-tag $prerelease
          fi
