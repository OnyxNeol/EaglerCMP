services:
  app:
    image: golang:1.23
    working_dir: /src
    volumes:
      - ./eaglercmp:/src
      - eagler-data:/data
      - gocache:/root/.cache/go-build
    environment:
      - EAGLERCMP_HOME=/data
    ports: ["3000:3000"]
    command: ["sh","-ec","go run . launch -no-window"]
    healthcheck:
      test: ["CMD-SHELL","curl -fsS -H 'Host: 127.0.0.1:47262' http://127.0.0.1:47262/ >/dev/null || (echo game server down; exit 1)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 120s
    restart: on-failure
  proxy:
    image: nginx:alpine
    network_mode: "service:app"
    depends_on:
      app: {condition: service_healthy}
    volumes:
      - ./proxy.nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: on-failure
volumes:
  eagler-data:
  gocache:
